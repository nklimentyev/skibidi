name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Prepare website
        run: |
          mkdir -p _site
          cp index.html styles.css app.js favicon.svg cloth-pro.png .nojekyll _site/
          cp -R fonts _site/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published website over HTTPS
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-published.mjs
